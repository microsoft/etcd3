version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    groups:
      npm-dependencies:
        patterns: ['*']
    ignore:
      # Keep TypeScript within the peer ranges supported by ESLint and TypeDoc.
      - dependency-name: 'typescript'
        versions: ['>=6.1.0']
    schedule:
      interval: 'weekly'
    cooldown:
      default-days: 7
  - package-ecosystem: 'github-actions'
    directory: '/'
    groups:
      github-actions:
        patterns: ['*']
    schedule:
      interval: 'weekly'
    cooldown:
      default-days: 7
